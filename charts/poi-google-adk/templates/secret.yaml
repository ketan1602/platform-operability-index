{{- if not .Values.llm.api_key -}}
  {{- fail "llm.api_key is required. Supply via --set llm.api_key=$AIREFINERY_API_KEY" -}}
{{- end -}}

---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.llm.api_key_secret_name | quote }}
  namespace: {{ .Values.tenant.namespace }}
  labels:
    app.kubernetes.io/name: {{ .Release.Name }}
    app.kubernetes.io/managed-by: Helm
    poi.benchmark/managed: "true"
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  api_key: {{ .Values.llm.api_key | b64enc | quote }}
