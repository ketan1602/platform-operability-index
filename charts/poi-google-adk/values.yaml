# POI Google ADK Helm Chart — Default Values
# Required values are left empty ("") — Helm will fail-fast if not supplied.
# ADK defaults to Cloud Run; ADK_RUNNER=local overrides to local execution.

agent:
  image: ""
  imagePullPolicy: Always
  replicas: 1
  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "1000m"
      memory: "1Gi"

litellm:
  base_url: ""

otel:
  endpoint: ""

llm:
  api_key_secret_name: "airefinery-creds"
  api_key: ""

tenant:
  name: ""
  namespace: "poi-google-adk"

env: []
