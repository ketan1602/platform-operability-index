# OTel Collector ConfigMap — poi-monitoring namespace
# Receives OTLP (gRPC + HTTP), exports to Prometheus and stdout.
# Processes OTel GenAI semantic-convention spans.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: poi-monitoring
  labels:
    poi.benchmark/managed: "true"
    app.kubernetes.io/name: otel-collector
    app.kubernetes.io/component: observability
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: "0.0.0.0:4317"
          http:
            endpoint: "0.0.0.0:4318"

    processors:
      batch:
        timeout: 5s
        send_batch_size: 1024

      resource:
        attributes:
          - key: poi.benchmark.run
            value: "true"
            action: upsert

      # Filter and enrich OTel GenAI semantic-convention spans
      attributes/genai:
        actions:
          - key: poi.benchmark.run
            value: "true"
            action: insert

    exporters:
      prometheus:
        endpoint: "0.0.0.0:8889"
        namespace: poi
        send_timestamps: true
        metric_expiration: 180m
        enable_open_metrics: true
        resource_to_telemetry_conversion:
          enabled: true

      debug:
        verbosity: basic
        sampling_initial: 5
        sampling_thereafter: 200

    extensions:
      health_check:
        endpoint: "0.0.0.0:13133"
      pprof:
        endpoint: "0.0.0.0:1888"

    service:
      extensions: [health_check, pprof]
      pipelines:
        traces:
          receivers: [otlp]
          processors: [resource, attributes/genai, batch]
          exporters: [debug]
        metrics:
          receivers: [otlp]
          processors: [resource, batch]
          exporters: [prometheus, debug]
        logs:
          receivers: [otlp]
          processors: [resource, batch]
          exporters: [debug]
