apiVersion: apps/v1
kind: Deployment
metadata:
  name: channel-adapter
  namespace: poi
spec:
  replicas: 1
  selector:
    matchLabels: {app: channel-adapter}
  template:
    metadata:
      labels: {app: channel-adapter}
    spec:
      containers:
      - name: server
        image: localhost:5000/poi-mock-servers:latest
        imagePullPolicy: Always
        env:
        - {name: SERVER_MODULE, value: channel_adapter}
        - {name: HTTP_PORT, value: "8103"}
        - {name: MCP_PORT,  value: "9103"}
        ports:
        - {containerPort: 8103, name: http}
        - {containerPort: 9103, name: mcp}
        livenessProbe:
          httpGet: {path: /health, port: 8103}
          initialDelaySeconds: 10
          periodSeconds: 15
        readinessProbe:
          httpGet: {path: /health, port: 8103}
          initialDelaySeconds: 5
          periodSeconds: 5
        resources:
          requests: {cpu: 50m, memory: 128Mi}
          limits:   {cpu: 200m, memory: 256Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: channel-adapter
  namespace: poi
spec:
  selector: {app: channel-adapter}
  ports:
  - {name: http, port: 8103, targetPort: 8103}
  - {name: mcp,  port: 9103, targetPort: 9103}
