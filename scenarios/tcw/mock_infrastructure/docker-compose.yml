version: "3.9"
services:
  neo4j-stub:
    build:
      context: .
      dockerfile: ../gew/mock_infrastructure/Dockerfile.mock
    command: uvicorn scenarios.tcw.mock_infrastructure.neo4j_stub:app --host 0.0.0.0 --port 8101
    ports:
      - "8101:8101"
    environment:
      - PYTHONPATH=/app

  ml-endpoint:
    build:
      context: .
      dockerfile: ../gew/mock_infrastructure/Dockerfile.mock
    command: uvicorn scenarios.tcw.mock_infrastructure.ml_endpoint:app --host 0.0.0.0 --port 8102
    ports:
      - "8102:8102"
    environment:
      - PYTHONPATH=/app

  channel-adapter:
    build:
      context: .
      dockerfile: ../gew/mock_infrastructure/Dockerfile.mock
    command: uvicorn scenarios.tcw.mock_infrastructure.channel_adapter:app --host 0.0.0.0 --port 8103
    ports:
      - "8103:8103"
    environment:
      - PYTHONPATH=/app
